# =============================================================================
# Sonrize Padel - Flutter Application
# Clean Architecture + TDD + Feature-First Structure
# =============================================================================

name: sonrize_padel
description: "A Padel court booking and management application built with Clean Architecture principles."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

# =============================================================================
# Dependencies - Core
# =============================================================================
dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # --- Dependency Injection ---
  get_it: ^8.0.3
  injectable: ^2.5.0

  # --- Routing ---
  go_router: ^14.8.1

  # --- Network ---
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3

  # --- Local Storage ---
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # --- Functional Programming ---
  fpdart: ^1.1.0
  dartz: ^0.10.1

  # --- Utilities ---
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Design System ---
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # --- Logging & Monitoring ---
  logger: ^2.5.0

# =============================================================================
# Dev Dependencies - Code Generation & Testing
# =============================================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Linting ---
  flutter_lints: ^6.0.0
  very_good_analysis: ^7.0.0

  # --- Testing ---
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter


# =============================================================================
# Flutter Configuration
# =============================================================================
flutter:
  uses-material-design: true

  assets:
    - assets/images/

